<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Lane - Nina & Mahmut 💖</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(
          135deg,
          #ffcee6 0%,
          #ffd6f1 50%,
          #e4f9ff 100%
        );
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      .confetti {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }

      .confetti-piece {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #ffd1f9;
        top: -20px;
        opacity: 0;
      }

      .scrapbook-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ff9eda' fill-opacity='0.2' fill-rule='evenodd'/%3E%3C/svg%3E");
        opacity: 0.7;
        z-index: -1;
      }

      .memory-lane-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }

      .header {
        text-align: center;
        margin-bottom: 3rem;
        animation: float 3s ease-in-out infinite;
      }

      .header h1 {
        font-size: 3.5rem;
        color: #ff4e91;
        margin-bottom: 1rem;
        font-family: "Pacifico", cursive;
        text-shadow: 3px 3px 0px rgba(255, 165, 213, 0.5);
        animation: heartbeat 1.5s ease-in-out infinite;
      }

      .header p {
        font-size: 1.2rem;
        color: #8858a3;
        max-width: 700px;
        margin: 0 auto;
        line-height: 1.6;
        background: rgba(255, 255, 255, 0.6);
        padding: 1rem 1.5rem;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
      }

      .gallery-container {
        position: relative;
        margin: 2rem 0;
      }

      .slideshow-controls {
        display: flex;
        justify-content: center;
        margin-bottom: 2rem;
        opacity: 0;
        animation: fadeIn 1s forwards 1s;
      }

      .btn {
        padding: 0.8rem 1.5rem;
        margin: 0 0.5rem;
        background: linear-gradient(45deg, #ff6ec4, #7873f5);
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(255, 110, 196, 0.5);
      }

      .btn:hover {
        background: linear-gradient(45deg, #7873f5, #ff6ec4);
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 6px 20px rgba(255, 110, 196, 0.7);
      }

      .gallery {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 1.5rem;
        padding: 1.5rem 0;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: #ff6ec4 #ffcee6;
      }

      .gallery::-webkit-scrollbar {
        height: 8px;
      }

      .gallery::-webkit-scrollbar-track {
        background: #ffcee6;
        border-radius: 10px;
      }

      .gallery::-webkit-scrollbar-thumb {
        background: #ff6ec4;
        border-radius: 10px;
      }

      .memory-card {
        flex: 0 0 auto;
        width: 300px;
        height: 400px;
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
        transform: translateY(50px) rotate(var(--rotate, 0deg));
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 8px solid white;
      }

      .memory-card.visible {
        transform: translateY(0) rotate(var(--rotate, 0deg));
        opacity: 1;
      }

      .memory-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }

      .memory-card:hover .memory-img {
        transform: scale(1.08);
      }

      .memory-caption {
        position: absolute;
        bottom: -100%;
        left: 0;
        width: 100%;
        background: rgba(255, 105, 180, 0.9);
        color: white;
        padding: 1.2rem;
        transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        border-bottom-left-radius: 15px;
        border-bottom-right-radius: 15px;
        font-size: 1rem;
        line-height: 1.4;
        text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.3);
      }

      .memory-card:hover .memory-caption {
        bottom: 0;
      }

      .card-tape {
        position: absolute;
        width: 100px;
        height: 35px;
        background: rgba(255, 255, 255, 0.8);
        top: -15px;
        left: 50%;
        transform: translateX(-50%) rotate(var(--rotate, 2deg));
        z-index: 2;
        box-shadow: 0 0 10px rgba(255, 20, 147, 0.2);
      }

      .card-sticker {
        position: absolute;
        width: 40px;
        height: 40px;
        z-index: 3;
        bottom: 10px;
        right: 10px;
        transform: rotate(15deg);
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
        animation: bounce 2s infinite;
      }

      .navigation-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 3rem;
      }

      #nextButton {
        background: linear-gradient(45deg, #ff4e91, #ff9a8b);
        font-size: 1.1rem;
        padding: 1rem 2rem;
        position: relative;
        overflow: hidden;
        animation: pulse 2s infinite;
      }

      #backButton {
        background: linear-gradient(45deg, #a485ff, #75c6ff);
      }

      .sticker {
        position: absolute;
        width: 60px;
        height: 60px;
        z-index: 5;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
        pointer-events: none;
        animation: float 3s ease-in-out infinite;
      }

      .sticker1 { top: 10%; left: 5%; animation-delay: 0.2s; }
      .sticker2 { bottom: 15%; right: 5%; animation-delay: 0.5s; }
      .sticker3 { bottom: 30%; left: 10%; animation-delay: 0.8s; }
      .sticker4 { top: 20%; right: 10%; animation-delay: 1.2s; }

      /* Floating Names & Glow Effects */
      .floating-name {
        position: fixed;
        font-weight: bold;
        font-size: 1.4rem;
        z-index: -1;
        pointer-events: none;
        text-shadow: 0 0 10px #ffffff, 0 0 20px #ff69b4;
        white-space: nowrap;
      }

      .glow-light {
        position: fixed;
        width: 10px;
        height: 10px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 15px 5px #ffffff, 0 0 25px 8px #ff1493;
        z-index: -1;
        pointer-events: none;
      }

      .balloon {
        position: fixed;
        width: 50px;
        height: 60px;
        background: radial-gradient(circle at 30% 30%, #ff7eb9, #ff1493);
        border-radius: 50%;
        box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.1);
        animation: floatUp 15s linear infinite;
        z-index: -1;
      }

      .balloon::before {
        content: "";
        position: absolute;
        width: 2px;
        height: 70px;
        background: rgba(0, 0, 0, 0.2);
        top: 100%;
        left: 50%;
      }

      @keyframes floatUp {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(5deg); }
      }

      @keyframes bounce {
        0%, 100% { transform: scale(1) rotate(15deg); }
        50% { transform: scale(1.2) rotate(20deg); }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 110, 196, 0.5); }
        50% { transform: scale(1.05); box-shadow: 0 10px 25px rgba(255, 110, 196, 0.7); }
      }

      @keyframes heartbeat {
        0%, 50%, 100% { transform: scale(1); }
        25%, 75% { transform: scale(1.05); }
      }

      @keyframes floatDown {
        0% { transform: translateY(-10px) rotate(0); opacity: 1; }
        100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
      }

      @media (max-width: 768px) {
        .header h1 { font-size: 2.5rem; }
        .memory-card { width: 250px; height: 340px; }
        .gallery { gap: 1rem; }
        .sticker { width: 45px; height: 45px; }
      }

      @media (max-width: 480px) {
        .header h1 { font-size: 2rem; }
        .header p { font-size: 0.95rem; }
        .memory-card { width: 220px; height: 310px; }
        .navigation-buttons { flex-direction: column; gap: 1rem; align-items: center; }
        .btn { width: 100%; max-width: 220px; }
      }
    </style>
  </head>
  <body>
    <div class="scrapbook-bg"></div>
    <div class="confetti" id="confetti-container"></div>

    <!-- Background Balloons -->
    <div class="balloon" style="left: 8%; animation-duration: 16s"></div>
    <div class="balloon" style="left: 22%; animation-duration: 14s; animation-delay: 2s"></div>
    <div class="balloon" style="left: 68%; animation-duration: 19s; animation-delay: 4s"></div>
    <div class="balloon" style="left: 88%; animation-duration: 15s; animation-delay: 1s"></div>

    <!-- Decorative Stickers -->
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23ff6ec4' /%3E%3Ctext x='50' y='65' font-family='Arial' font-size='40' text-anchor='middle' fill='white'%3E✨%3C/text%3E%3C/svg%3E" class="sticker sticker1" alt="Sticker" />
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23a485ff' /%3E%3Ctext x='50' y='65' font-family='Arial' font-size='40' text-anchor='middle' fill='white'%3E♥%3C/text%3E%3C/svg%3E" class="sticker sticker2" alt="Sticker" />
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23ff4e91' /%3E%3Ctext x='50' y='65' font-family='Arial' font-size='40' text-anchor='middle' fill='white'%3E★%3C/text%3E%3C/svg%3E" class="sticker sticker3" alt="Sticker" />
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23c175ff' d='M50 0 L75 25 L100 0 L75 50 L100 100 L50 75 L0 100 L25 50 L0 0 L25 25 Z' /%3E%3C/svg%3E" class="sticker sticker4" alt="Sticker" />

    <div class="memory-lane-container">
      <div class="header">
        <h1>Our Memory Lane 💖</h1>
        <p>
          Hey <b>Nina</b>! A journey through the most incredible moments we've shared together, curated with love by <b>Mahmut</b>. 
          Hover over each photo to relive our favorite memories! ✨
        </p>
      </div>

      <div class="slideshow-controls">
        <button id="startSlideshow" class="btn">
          <span>▶ Start Slideshow</span>
        </button>
        <button id="pauseSlideshow" class="btn" style="display: none">
          <span>⏸ Pause Slideshow</span>
        </button>
      </div>

      <div class="gallery-container">
        <!-- Memory cards loaded dynamically via JS -->
        <div class="gallery" id="memoryGallery"></div>
      </div>

      <div class="navigation-buttons">
        <button id="backButton" class="btn">
          <span>← Back to Home</span>
        </button>
        <button id="nextButton" class="btn">
          <span>✨ Next Surprise! ✨</span>
        </button>
      </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      // Customized Memories Data for Nina & Mahmut
      const memories = [
        {
          image: "1.jpg",
          caption: "Remember when Nina & Mahmut got lost hiking and found that waterfall? Best wrong turn ever! 😂",
          rotationAngle: -2,
          emoji: "🌊",
        },
        {
          image: "2.jpeg",
          caption: "That time we stayed up all night talking and watching the sunrise. Never laughed so hard! 🌅",
          rotationAngle: 3,
          emoji: "🌅",
        },
        {
          image: "3.jpg",
          caption: "Our first road trip! You fell asleep and I drew a mustache on you. You didn't notice for HOURS! 🚗",
          rotationAngle: -1,
          emoji: "🚗",
        },
        {
          image: "4.jpg",
          caption: "Remember our cooking disaster? The smoke alarm went off, but our pizza party after was epic! 🍕",
          rotationAngle: 2,
          emoji: "🍕",
        },
        {
          image: "5.jpg",
          caption: "Camping under the stars. Nina jumped so high because of a tiny spider! Best memory ever. 🏕️",
          rotationAngle: -3,
          emoji: "🏕️",
        },
        {
          image: "7.jpg",
          caption: "That concert where we danced until our feet hurt. Worth every single blister! 🎵",
          rotationAngle: 1,
          emoji: "🎵",
        },
        {
          image: "8.jpg",
          caption: "Building our epic blanket fort during the storm. Best rainy day ever with my bestie! 🏰",
          rotationAngle: -2,
          emoji: "🏰",
        },
        {
          image: "1.jpg",
          caption: "Spontaneous beach day! I still find sand in my backpack from that fun trip! 🏖️",
          rotationAngle: 2,
          emoji: "🏖️",
        },
        {
          image: "2.jpeg",
          caption: "Always there for each other through thick & thin. So grateful for you, Nina! ❤️ - Mahmut",
          rotationAngle: -1,
          emoji: "💕",
        },
        {
          image: "3.jpg",
          caption: "Happy Birthday Nina! Here's to many more adventures together! 🎉🎂",
          rotationAngle: 3,
          emoji: "🎂",
        },
      ];

      // Confetti Generator
      function createConfetti() {
        const confettiContainer = document.getElementById("confetti-container");
        const colors = ["#ff6ec4", "#a485ff", "#ff4e91", "#c175ff", "#75c6ff"];

        for (let i = 0; i < 60; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti-piece";

          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.width = Math.random() * 12 + 6 + "px";
          confetti.style.height = Math.random() * 12 + 6 + "px";
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

          const duration = Math.random() * 3 + 3;
          const delay = Math.random() * 5;

          confetti.style.animation = `floatDown ${duration}s ease-in ${delay}s infinite`;
          confetti.style.opacity = Math.random();

          confettiContainer.appendChild(confetti);
        }
      }

      // Background Floating Names & Glow Effects
      function createFloatingBackgroundElements() {
        const names = ["Nina ✨", "Mahmut 💖", "Besties 🌸", "Nina & Mahmut 💫"];
        const colors = ["#FF1493", "#8A2BE2", "#FF69B4", "#7873F5"];

        for (let i = 0; i < 20; i++) {
          setTimeout(() => {
            const isName = Math.random() > 0.4;
            const element = document.createElement("div");

            if (isName) {
              element.className = "floating-name";
              element.innerText = names[Math.floor(Math.random() * names.length)];
              element.style.color = colors[Math.floor(Math.random() * colors.length)];
            } else {
              element.className = "glow-light";
            }

            element.style.left = Math.random() * 90 + "vw";
            element.style.top = (window.innerHeight + 50) + "px";

            document.body.appendChild(element);

            gsap.to(element, {
              y: -(window.innerHeight + 150),
              x: "+=" + (Math.random() * 100 - 50),
              duration: Math.random() * 8 + 7,
              ease: "power1.out",
              onComplete: () => {
                if (element.parentNode) element.parentNode.removeChild(element);
              }
            });
          }, i * 400);
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        createConfetti();
        createFloatingBackgroundElements();
        setInterval(createFloatingBackgroundElements, 6000);

        const galleryElement = document.getElementById("memoryGallery");
        const startSlideshowBtn = document.getElementById("startSlideshow");
        const pauseSlideshowBtn = document.getElementById("pauseSlideshow");
        const backButton = document.getElementById("backButton");
        const nextButton = document.getElementById("nextButton");

        let slideshowInterval;
        let currentSlide = 0;

        // Render Memory Cards Dynamically
        memories.forEach((memory, index) => {
          const memoryCard = document.createElement("div");
          memoryCard.className = "memory-card visible";
          memoryCard.style.setProperty("--rotate", `${memory.rotationAngle}deg`);

          memoryCard.innerHTML = `
            <div class="card-tape" style="--rotate: ${memory.rotationAngle * 2}deg"></div>
            <img class="memory-img" src="${memory.image}" alt="Memory ${index + 1}" />
            <div class="memory-caption">${memory.caption}</div>
            <div class="card-sticker">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="#ff6ec4" />
                <text x="50" y="65" font-family="Arial" font-size="40" text-anchor="middle" fill="white">${memory.emoji}</text>
              </svg>
            </div>
          `;

          galleryElement.appendChild(memoryCard);
        });

        // Slideshow controls logic
        function startSlideshow() {
          startSlideshowBtn.style.display = "none";
          pauseSlideshowBtn.style.display = "flex";

          if (slideshowInterval) clearInterval(slideshowInterval);

          slideshowInterval = setInterval(() => {
            currentSlide = (currentSlide + 1) % memories.length;
            const cards = galleryElement.querySelectorAll(".memory-card");
            if (cards[currentSlide]) {
              const galleryRect = galleryElement.getBoundingClientRect();
              galleryElement.scrollTo({
                left: cards[currentSlide].offsetLeft - galleryRect.width / 2 + 150,
                behavior: "smooth",
              });
            }
          }, 2500);
        }

        function pauseSlideshow() {
          pauseSlideshowBtn.style.display = "none";
          startSlideshowBtn.style.display = "flex";

          if (slideshowInterval) {
            clearInterval(slideshowInterval);
            slideshowInterval = null;
          }
        }

        startSlideshowBtn.addEventListener("click", startSlideshow);
        pauseSlideshowBtn.addEventListener("click", pauseSlideshow);

        backButton.addEventListener("click", () => {
          window.location.href = "index.html"; // Pehle page ka link
        });

        nextButton.addEventListener("click", () => {
          window.location.href = "cake.html"; // Agle surprise page ka link
        });

        // Animations
        gsap.from(".header", {
          duration: 1,
          y: -50,
          opacity: 0,
          ease: "back.out(1.7)",
        });

        gsap.from(".navigation-buttons", {
          duration: 1,
          y: 50,
          opacity: 0,
          delay: 0.5,
          ease: "power3.out",
        });

        gsap.utils.toArray(".sticker").forEach((sticker) => {
          gsap.to(sticker, {
            rotation: "random(-20, 20)",
            duration: "random(2, 4)",
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut",
          });
        });
      });
    </script>
  </body>
</html>
