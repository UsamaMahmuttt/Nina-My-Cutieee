<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise For Nina ✨</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8e1f4, #e0c3f7, #c2e6ff);
            background-size: 400% 400%;
            animation: gradientBackground 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 3s forwards 0.5s;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            color: #6a4c93;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 105, 180, 0.4);
        }

        /* Letter Section */
        .letter-container {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(106, 76, 147, 0.3);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .letter-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            box-shadow: inset 0 0 15px rgba(255, 215, 232, 0.7);
            pointer-events: none;
            z-index: 1;
        }

        .letter {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #333;
            position: relative;
            z-index: 2;
            min-height: 200px;
            white-space: pre-line; /* Keeps line breaks from typed.js */
        }

        /* Surprise Button */
        .surprise-button-container {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .surprise-button {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #a18cd1);
            background-size: 300% 300%;
            animation: gradientButton 5s ease infinite;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(161, 140, 209, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .surprise-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(161, 140, 209, 0.7);
        }

        .surprise-button:active {
            transform: translateY(1px);
        }

        /* Surprise Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            transform: scale(0.8);
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 215, 232, 0.8);
            text-align: center;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            color: #6a4c93;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Playlist Styling */
        .playlist {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(240, 240, 255, 0.7);
            transition: all 0.2s ease;
        }

        .playlist-item:hover {
            background: rgba(225, 225, 255, 0.9);
            transform: translateX(5px);
        }

        .playlist-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }

        .playlist-item-info {
            flex-grow: 1;
            text-align: left;
        }

        .playlist-item-title {
            font-weight: bold;
            color: #6a4c93;
        }

        .playlist-item-artist {
            font-size: 0.85rem;
            color: #777;
        }

        .playlist-item-play {
            background: none;
            border: none;
            color: #6a4c93;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Back Button */
        .back-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #6a4c93;
            color: #6a4c93;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #6a4c93;
            color: white;
        }

        /* Floating Elements & Glow */
        .floating-element {
            position: fixed;
            pointer-events: none;
            opacity: 0.8;
            z-index: 1;
            animation: float 6s ease-in-out infinite alternate;
        }

        .floating-name {
            position: fixed;
            font-weight: bold;
            font-size: 1.4rem;
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ff69b4;
            white-space: nowrap;
            animation: floatUp 12s linear infinite;
        }

        .glow-light {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px 5px #ffffff, 0 0 25px 8px #ff1493;
            z-index: 1;
            pointer-events: none;
            animation: floatUp 10s linear infinite;
        }

        /* Music Controls */
        .music-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(106, 76, 147, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-controls:hover {
            transform: scale(1.15);
        }

        .music-controls i {
            color: #6a4c93;
            font-size: 22px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes gradientButton {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-25px) rotate(8deg); }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Cursor Effect */
        .cursor-effect {
            position: fixed;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.8);
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .container { padding: 15px; }
            .letter-container { padding: 20px; }
            .letter { font-size: 1rem; }
            .surprise-button { font-size: 1.2rem; padding: 12px 30px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>For My Bestie, Nina ❤️</h1>
        </header>

        <div class="letter-container">
            <div class="letter" id="typed-text"></div>
        </div>

        <div class="surprise-button-container">
            <button class="surprise-button" id="surprise-button">
                Click for a Surprise! 🎁
            </button>
        </div>

        <div class="navigation" style="text-align: center;">
            <a href="javascript:history.back()" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Previous Page
            </a>
        </div>
    </div>

    <!-- Modal for Surprise -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <button class="modal-close" id="modal-close">×</button>
            <div class="modal-header">
                <h2 style="color: #6a4c93;">🎉 Your Special Playlist! 🎉</h2>
            </div>
            <div class="modal-body">
                <div class="playlist">
                    <h3 style="margin-bottom: 15px; color: #ff1493;">Songs That Remind Me of Us 💕</h3>
                    <div class="playlist-item">
                        <img src="3.jpg" alt="Song cover">
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">Best Friends Anthem</div>
                            <div class="playlist-item-artist">Dedicated to Nina</div>
                        </div>
                        <button class="playlist-item-play"><i class="fas fa-play"></i></button>
                    </div>
                    <div class="playlist-item">
                        <img src="1.jpg" alt="Song cover">
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">That Fun Roadtrip</div>
                            <div class="playlist-item-artist">Memories with Mahmut</div>
                        </div>
                        <button class="playlist-item-play"><i class="fas fa-play"></i></button>
                    </div>
                    <div class="playlist-item">
                        <img src="2.jpeg" alt="Song cover">
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">Late Night Laughs</div>
                            <div class="playlist-item-artist">Unstoppable Duo</div>
                        </div>
                        <button class="playlist-item-play"><i class="fas fa-play"></i></button>
                    </div>
                    <div class="playlist-item">
                        <img src="5.jpg" alt="Song cover">
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">Birthday Celebration</div>
                            <div class="playlist-item-artist">Happy Beats</div>
                        </div>
                        <button class="playlist-item-play"><i class="fas fa-play"></i></button>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <button class="back-button" onclick="alert('Sending you endless virtual hugs! 🤗💖')" style="background: #ffb6c1; border-color: #ffb6c1; color: white; cursor: pointer;">
                        <i class="fas fa-heart"></i> Accept Virtual Hug!
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Music Controls -->
    <div class="music-controls" id="music-toggle">
        <i class="fas fa-volume-mute" id="music-icon"></i>
    </div>

    <!-- Audio Elements -->
    <audio id="click-sound" preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_bb630cc098.mp3?filename=cute-notification-ringtone-1-173850.mp3" type="audio/mpeg">
    </audio>
    <audio id="background-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=relaxing-145038.mp3" type="audio/mpeg">
    </audio>

    <!-- JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.5.1/confetti.browser.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Container Fade-in
            setTimeout(() => {
                document.querySelector('.container').style.opacity = 1;
            }, 300);

            // Personalized Typed Letter from Mahmut to Nina
            const letterContent = "My dearest Nina,\n\nAs I sit here thinking about all our incredible memories together, I can't help but smile. From our late-night talks to our spontaneous adventures, you've filled my life with so much joy and laughter.\n\nYou've been my shoulder to cry on, my partner in crime, and my absolute favorite person to talk to.\n\nOn your special day, I want you to know how truly grateful I am to have you as my best friend. You make every day brighter just by being you — kind, hilarious, and thoughtful.\n\nHappy Birthday, Nina! Here's to many more years of great friendship and amazing memories together.\n\nWith all my love,\nMahmut 💖";
            
            new Typed('#typed-text', {
                strings: [letterContent],
                typeSpeed: 35,
                showCursor: true,
                cursorChar: '|'
            });

            // Floating Background Elements (Balloons, Hearts, Lights, Nina & Mahmut Names)
            function createFloatingBackground() {
                const names = ['Nina ✨', 'Mahmut 💖', 'Besties 🌸', 'Nina & Mahmut 💫'];
                const colors = ['#ff6b8a', '#f48fb1', '#a18cd1', '#ff1493', '#8a2be2'];
                const types = ['heart', 'star', 'balloon', 'name', 'glow'];

                for (let i = 0; i < 25; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        const selectedType = types[Math.floor(Math.random() * types.length)];

                        el.style.left = Math.random() * 95 + 'vw';
                        el.style.top = (window.innerHeight + 50) + 'px';

                        if (selectedType === 'name') {
                            el.className = 'floating-name';
                            el.innerText = names[Math.floor(Math.random() * names.length)];
                            el.style.color = colors[Math.floor(Math.random() * colors.length)];
                        } else if (selectedType === 'glow') {
                            el.className = 'glow-light';
                        } else {
                            el.className = 'floating-element';
                            if (selectedType === 'heart') {
                                el.innerHTML = '<i class="fas fa-heart"></i>';
                                el.style.color = colors[Math.floor(Math.random() * colors.length)];
                                el.style.fontSize = (Math.random() * 15 + 15) + 'px';
                            } else if (selectedType === 'star') {
                                el.innerHTML = '<i class="fas fa-star"></i>';
                                el.style.color = '#ffd54f';
                                el.style.fontSize = (Math.random() * 15 + 12) + 'px';
                            } else if (selectedType === 'balloon') {
                                el.innerText = '🎈';
                                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                            }
                            
                            // Custom Float Animation Upward
                            el.style.animation = `floatUp ${Math.random() * 8 + 6}s linear infinite`;
                        }

                        document.body.appendChild(el);

                        setTimeout(() => {
                            if (el.parentNode) el.parentNode.removeChild(el);
                        }, 12000);
                    }, i * 350);
                }
            }

            createFloatingBackground();
            setInterval(createFloatingBackground, 7000);

            // Cursor Trail Effect
            document.addEventListener('mousemove', function(e) {
                const cursorEffect = document.createElement('div');
                cursorEffect.classList.add('cursor-effect');
                cursorEffect.style.left = `${e.clientX}px`;
                cursorEffect.style.top = `${e.clientY}px`;
                document.body.appendChild(cursorEffect);
                
                setTimeout(() => {
                    cursorEffect.style.opacity = 1;
                    cursorEffect.style.transform = `translate(-50%, -50%) scale(${Math.random() * 0.5 + 0.5})`;
                    setTimeout(() => {
                        cursorEffect.style.opacity = 0;
                        setTimeout(() => cursorEffect.remove(), 400);
                    }, 250);
                }, 10);
            });

            // Surprise Modal Logic
            const surpriseButton = document.getElementById('surprise-button');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalClose = document.getElementById('modal-close');
            const clickSound = document.getElementById('click-sound');

            surpriseButton.addEventListener('click', function() {
                clickSound.play().catch(err => console.log(err));
                modalOverlay.classList.add('active');
                
                // Confetti Explosion
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            });

            modalClose.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
            });

            // Music Toggle Controls
            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');
            const backgroundMusic = document.getElementById('background-music');
            let isMusicPlaying = false;

            musicToggle.addEventListener('click', function() {
                if (isMusicPlaying) {
                    backgroundMusic.pause();
                    musicIcon.classList.remove('fa-volume-up');
                    musicIcon.classList.add('fa-volume-mute');
                } else {
                    backgroundMusic.play().catch(e => console.log('Audio error:', e));
                    musicIcon.classList.remove('fa-volume-mute');
                    musicIcon.classList.add('fa-volume-up');
                }
                isMusicPlaying = !isMusicPlaying;
            });
        });
    </script>
</body>
</html>
